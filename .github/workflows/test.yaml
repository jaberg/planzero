name: Test Suite

on: push

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Tmate Session
        uses: mxschmitt/action-tmate@v3
        if: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            base_requirements.txt
            requirements_dev.txt

      - name: Install base dependencies
        run: pip install -r base_requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements_dev.txt

      - name: Pytest
        env:
          PLANZERO_DATA: "${{ github.workspace }}/data"
          PLANZERO_USE_DISK_CACHE: "1"
          PLANZERO_CACHE_DIR: "${{ github.workspace }}/.planzero_cache"
          PLANZERO_APP_CACHE_DIR: "${{ github.workspace }}/.planzero_app_cache"
          PLANZERO_HOME_SHOW_PLANNED_POSTS: "0"
          PLANZERO_HOME_SHOW_UNPUBLISHED_POSTS: "0"
          GITHUB_WORKSPACE: "${{github.workspace}}"
        run: pytest -W error --maxfail=10 .

      - name: Save App Cache for Deploy
        if: (github.repository == 'jaberg/planzero') && (github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          path: "${{ github.workspace }}/.planzero_app_cache"

  deploy:
    needs: build_and_test
    if: (github.repository == 'jaberg/planzero') && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: "Fly Deploy"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Load App cache
        uses: actions/download-artifact@v8
        with:
          path: "${{ github.workspace }}/.planzero_app_cache"

      - run: flyctl deploy --remote-only --config fly_gh.toml
        env:
          FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}"

# https://github.com/tespkg/actions-cache
# https://github.com/itchyny/s3-cache-action
