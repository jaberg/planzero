name: Test

on: push

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Tmate Session
        uses: mxschmitt/action-tmate@v3
        if: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            base_requirements.txt
            requirements_dev.txt

      - name: Install base dependencies
        run: pip install -r base_requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements_dev.txt

      - name: Cache Static Normals
        id: cache-static-normals
        uses: actions/cache@v5
        with:
          path: ~/foo
          key: foo-v1

      - name: Populate the cache
        if: ${{ steps.cache-static-normals.outputs.cache-hit != 'true'}}
        run: date >> ~/foo

      - name: Pytest
        env:
          PLANZERO_DATA: "${{ github.workspace }}/data"
          PLANZERO_USE_DISK_CACHE: "1"
          PLANZERO_CACHE_DIR: "${{ github.workspace }}/.planzero_cache"
          PLANZERO_APP_CACHE_DIR: "${{ github.workspace }}/.planzero_app_cache"
          PLANZERO_HOME_SHOW_PLANNED_POSTS: "0"
          PLANZERO_HOME_SHOW_UNPUBLISHED_POSTS: "0"
          GITHUB_WORKSPACE: "${{github.workspace}}"
        run: pytest -W error --maxfail=10 .
