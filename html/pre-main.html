<html>
	<head>
		<title>{{ title }}</title>

		<link rel="stylesheet" href="/assets/css/main.css" />
		<noscript><link rel="stylesheet" href="/assets/css/noscript.css" /></noscript>
        <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>

        <script type="module" src="https://cdn.jsdelivr.net/npm/@maps4html/mapml@latest/dist/mapml.js" crossorigin></script>
        <style>
        /* Custom styles for the sort indicators */
        .sort-indicator {
            margin-left: 0.5rem;
            display: inline-block;
            transition: transform 0.2s ease-in-out;
        }

        /* Styles for ascending and descending states */
        .th-sorted-asc .sort-indicator {
            transform: rotate(0deg);
        }
        .th-sorted-desc .sort-indicator {
            transform: rotate(180deg);
        }

        /* Make header cells look clickable */
        .sortable-th {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease-in-out;
        }
        .sortable-th:hover {
            background-color: #f3f4f6; /* Light gray on hover */
        }

        /* Table of contents: shared base */
        .table-of-contents {
            font-family: "Source Sans Pro", Helvetica, sans-serif;
            font-size: 0.95rem;
            line-height: 1.3;
            margin: 0 0 2rem 0;
        }
        .table-of-contents > b {
            display: block;
            font-weight: 900;
            font-size: 0.8rem;
            letter-spacing: 0.075em;
            text-transform: uppercase;
            color: #18bfef;
            margin-bottom: 0.4rem;
        }
        .table-of-contents ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .table-of-contents li {
            padding: 0;
            margin: 0;
        }
        .table-of-contents a {
            border-bottom: 0;
        }

        /* Option A (toc-rule): accent rule, indented guides for nested lists */
        .table-of-contents.toc-rule {
            border-top: solid 2px #18bfef;
            padding-top: 0.6rem;
        }
        .table-of-contents.toc-rule > ul > li {
            font-weight: 600;
            margin-top: 0.4rem;
        }
        .table-of-contents.toc-rule > ul > li:first-child {
            margin-top: 0;
        }
        .table-of-contents.toc-rule ul ul {
            margin: 0.15rem 0 0 0;
            padding-left: 0.9rem;
            border-left: solid 1px #eeeeee;
        }
        .table-of-contents.toc-rule ul ul li {
            font-weight: 300;
        }
        .table-of-contents.toc-rule ul ul ul {
            font-size: 0.9rem;
        }

        /* Glossary reference tooltip (used by siteref / local_ref) */
        .glossary-ref {
            position: relative;
        }
        .glossary-ref-tip {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 50%;
            width: max-content;
            max-width: min(24rem, 70vw);
            padding: 0.6rem 0.8rem;
            background: #ffffff;
            border: solid 1px #eeeeee;
            border-top: solid 2px #18bfef;
            box-shadow: 0 2px 6px rgba(33, 41, 49, 0.12);
            color: #212931;
            font-family: "Merriweather", Georgia, serif;
            font-size: 0.75rem;
            line-height: 1.6;
            text-align: left;
            visibility: hidden;
            opacity: 0;
            transform: translate(-50%, 0.25rem);
            transition: opacity 0.15s ease, transform 0.15s ease;
            pointer-events: none;
            z-index: 30;
        }
        .glossary-ref:hover .glossary-ref-tip,
        .glossary-ref:focus-within .glossary-ref-tip {
            visibility: visible;
            opacity: 1;
            transform: translate(-50%, 0);
        }
        @media (hover: none) {
            .glossary-ref-tip { display: none; }
        }
    </style>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
        <div id="wrapper" {% if fade_in_intro %}class="fade-in"{% endif %}>
            {% if fade_in_intro %}

				<!-- Intro -->
					<div id="intro">
						<h1>Plan Zero </h1>
						<p>An independent research project to model how Canada might achieve<br />
						zero net emissions.</p>
						<ul class="actions">
							<li><a href="#header" class="button icon solid solo fa-arrow-down scrolly">Continue</a></li>
						</ul>
					</div>
            {% endif %}

				<!-- Header -->
					<header id="header">
                        <a href="/" class="logo"><b>Plan Zero</b></a>
					</header>

				<!-- Nav -->
					<nav id="nav">
						<ul class="links">
							<li {% if active_tab == "blog" %}class="active" {% endif %}><a href="/">Posts</a></li>
                            <li {% if active_tab == "ipcc_sectors" %}class="active" {% endif %}><a href="/ipcc-sectors/">Sectors</a></li>
                            <li {% if active_tab == "models" %}class="active" {% endif %}><a href="/models/">Models</a></li>
                            <li {% if active_tab == "metrics" %}class="active" {% endif %}><a href="/metrics/">Metrics</a></li>
                            <li {% if active_tab == "strategies" %}class="active" {% endif %}><a href="/strategies/">Strategies</a></li>
                            <li {% if active_tab == "glossary" %}class="active" {% endif %}><a href="/glossary/">Glossary</a></li>
                            <li {% if active_tab == "about" %}class="active" {% endif %}><a href="/about/">About</a></li>
						</ul>
						<ul class="icons">
							<li><a href="https://github.com/jaberg/planzero" class="icon brands fa-github"><span class="label">GitHub</span></a></li>
						</ul>
					</nav>
